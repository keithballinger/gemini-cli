[package]
name = "gemini-shell"
version = "0.1.0"
edition = "2021"
authors = ["Gemini Shell Contributors"]
description = "High-performance POSIX-compliant shell with AI integration"
license = "Apache-2.0"
repository = "https://github.com/google/gemini-cli"

[dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"

# HTTP/WebSocket client
reqwest = { version = "0.11", features = ["json", "stream"] }
tokio-tungstenite = "0.20"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Terminal UI
crossterm = "0.27"
ratatui = "0.24"

# CLI argument parsing
clap = { version = "4.0", features = ["derive"] }

# Shell parsing
pest = "2.7"
pest_derive = "2.7"
shell-words = "1.1"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Process management
nix = { version = "0.27", features = ["process", "signal"] }

# File system operations
dirs = "5.0"
walkdir = "2.4"

# String utilities
regex = "1.10"
unicode-width = "0.1"

# Async utilities
async-trait = "0.1"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["processthreadsapi", "wincon", "handleapi"] }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.8"
criterion = "0.5"
