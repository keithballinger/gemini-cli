disabled_rules:
  - trailing_whitespace
  - line_length

opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_first_not_nil
  - force_unwrapping
  - implicitly_unwrapped_optional
  - missing_docs

excluded:
  - .build
  - Tests
  - Package.swift

line_length:
  warning: 120
  error: 200
  ignores_function_declarations: true
  ignores_comments: true

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 1000

function_body_length:
  warning: 50
  error: 100

identifier_name:
  min_length:
    warning: 2
  max_length:
    warning: 40
    error: 60

custom_rules:
  todo_fixme:
    name: "TODO/FIXME"
    regex: "(TODO|FIXME)"
    message: "TODOs and FIXMEs should be resolved before merging"
    severity: warning